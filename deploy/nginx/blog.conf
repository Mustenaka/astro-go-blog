# Nginx site config for the blog. Placeholders are filled by deploy/scripts (local WSL run) or by
# the phase-7 release tooling:
#   __LISTEN__        e.g. "8088" (local) or "443 ssl http2" (production)
#   __SERVER_NAME__   e.g. "localhost" or "www.mustenaka.cn"
#   __SITE_ROOT__     directory that holds the built site (contents of site/dist), e.g. /srv/blog/site
#
# Rules from AGENTS.md section 6:
#   - the public site is static files only
#   - only /api/v1/ is forwarded to the Go process on 127.0.0.1:8080
#   - /admin/, /hooks/ and /_local/ are never exposed here (SSH tunnel to :8080 instead)
#   - /assets/ falls back to the CDN in production; in the local run it is proxied to the Go local storage

# Legacy WordPress URLs -> new URLs. The file is generated by `pnpm -C site build`.
# A value of 410 means the old URL is gone.
map $uri $legacy_redirect {
    include __SITE_ROOT__/redirects.map;
    default "";
}

server {
    listen __LISTEN__;
    server_name __SERVER_NAME__;

    root __SITE_ROOT__;
    index index.html;
    charset utf-8;

    # --- security headers on every response ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Islands and inline enhancement scripts are inline; Artalk/CDN origins are added in phase 7.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https:; font-src 'self'; connect-src 'self' http: https:; frame-src 'self' http: https:; frame-ancestors 'self'; base-uri 'none'" always;

    # --- compression ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml text/markdown image/svg+xml;
    gzip_min_length 1024;

    # --- legacy 301 / 410 ---
    if ($legacy_redirect = 410) { return 410; }
    if ($legacy_redirect) { return 301 $legacy_redirect; }

    # --- the only dynamic surface on the public site ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # Anything else that belongs to the Go process must not be reachable from the internet.
    location ~ ^/(admin|hooks|_local)(/|$) { return 404; }

    # --- assets ---
    # Local run: the Go local storage adapter serves /assets/ (with br / COOP / COEP headers).
    # Production: replace the proxy with `return 302 https://cdn.example.com$request_uri;`
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- static site ---
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }
    location = /rss.xml {
        types { }
        default_type "application/rss+xml; charset=utf-8";
    }
    location ~* \.(txt|xml|json|map)$ {
        add_header Cache-Control "public, max-age=300";
    }
    location /_astro/ {
        # hashed file names: cache forever
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
